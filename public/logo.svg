<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Minimal Dark Rounded Frame -->
  <rect width="100" height="100" rx="24" fill="#080c14" />
  <rect width="100" height="100" rx="24" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Outer Guideline -->
  <circle cx="50" cy="50" r="36" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.15" />

  <!-- Razor-Sharp Minimalist Pointer (North-East Growth Vector) -->
  <!-- Top-Right Tip: (76, 24), Width points: (43, 43) and (57, 57), Center: (50, 50) -->
  <!-- North Facet - Radiant Amber -->
  <polygon points="76,24 43,43 50,50" fill="#f59e0b" />
  <!-- East Facet - Deep Warm Gold -->
  <polygon points="76,24 57,57 50,50" fill="#d97706" />

  <!-- Tail - Sleek Stealth Contrast -->
  <polygon points="24,76 43,43 50,50" fill="#334155" />
  <polygon points="24,76 57,57 50,50" fill="#1e293b" />

  <!-- Center Pivot Core -->
  <circle cx="50" cy="50" r="3.5" fill="#fef08a" />
</svg>
