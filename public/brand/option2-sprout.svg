  <!-- Minimal Dark Rounded Frame -->
  <rect width="100" height="100" rx="24" fill="#080c14" />
  <rect width="100" height="100" rx="24" stroke="#1e293b" stroke-width="1.5" />

  <!-- Single Elegant Ascending Growth Curve -->
  <path d="M 28 72 C 34 72 44 68 54 54 C 64 40 70 30 74 26" 
        stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" />

